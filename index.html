<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10月自考 · 学习工作台</title>
<style>
:root{
 --bg:#f2efe9; --panel:#faf8f5; --line:#e5dfd5; --line2:#f0ece5;
 --tx:#2d2a26; --tx2:#5e5952; --tx3:#8a847a;
 --c0229:#d97706; --c13000:#0284c7; --c0220:#2563eb;
 --c0808:#7c3aed; --c0247:#059669; --c13702:#dc2626;
 --warn:#b45309; --ok:#047857;
 --side:250px;
 --shadow:0 1px 2px rgba(0,0,0,.04);
 --shadow-h:0 3px 10px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
a{color:inherit;text-decoration:none}

/* sidebar — soft & warm */
aside{width:var(--side);background:#f7f4ef;color:var(--tx2);flex:none;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:10;font-size:13px;border-right:1px solid #e8e2d8;box-shadow:1px 0 4px rgba(0,0,0,.03)}
aside::-webkit-scrollbar{width:4px}
aside::-webkit-scrollbar-thumb{background:#cdc5b8;border-radius:4px}
.s-top{padding:22px 18px 14px}
.s-top h2{font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.3px}
.s-top .dt{font-size:11px;color:var(--tx3);margin-top:3px}
.s-sec{padding:12px 18px 6px;font-size:10.5px;color:var(--tx3);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.si{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:var(--tx2);transition:all .15s;border-left:3px solid transparent;font-size:13px;text-decoration:none;border-radius:0 6px 6px 0;margin-right:8px}
.si:hover{background:#eee8db;color:var(--tx)}
.si.on{background:#e8e1d4;color:var(--tx);border-left-color:#d97706;font-weight:650}
.si .bar{width:3px;height:14px;border-radius:3px;flex:none}
.si .pct{font-size:10.5px;color:var(--tx3);margin-left:auto;background:#e8e1d4;padding:1.5px 6px;border-radius:4px}
.si.on .pct{background:#dcd2c0;color:var(--tx2)}

/* main */
main{margin-left:var(--side);flex:1;min-width:0}
.pg{display:none;padding:32px 36px 80px;max-width:960px}
.pg.on{display:block}

/* countdown strip */
.cds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:24px}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.cd .lb{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:5px;font-weight:600;letter-spacing:.3px}
.cd .nm{font-size:26px;font-weight:700;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.cd .nm small{font-size:11px;font-weight:400;color:var(--tx3)}
.cd .dt{font-size:10.5px;color:var(--tx3);margin-top:3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--tx3);display:inline-block;flex:none}
.dot.r{background:#ef4444;animation:bl 1.8s infinite}
@keyframes bl{50%{opacity:.2}}
.cd.urgent{border-color:#fcd34d;background:#fffef5}
.cd.urgent .nm{color:#d97706}

/* page header */
.phd{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.phd .cdt{font-size:20px;font-weight:700;letter-spacing:-.3px}
.phd .tag{font-size:10.5px;font-weight:600;color:#fff;padding:3px 8px;border-radius:5px;white-space:nowrap;letter-spacing:.2px}
.pdesc{font-size:12.5px;color:var(--tx2);margin-bottom:20px;line-height:1.7}
.pdesc b{color:var(--tx)}

/* alarm */
.alarm{background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:13px 16px;font-size:12px;color:#92400e;margin-bottom:18px;line-height:1.7}
.alarm b{color:#78350f}

/* progress */
.pbar{margin-bottom:22px;display:flex;align-items:center;gap:14px}
.pbar .track{flex:1;height:7px;background:#e5e8ed;border-radius:10px;overflow:hidden}
.pbar .track i{display:block;height:100%;border-radius:10px;transition:width .35s}
.pbar .num{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}

/* section titles */
.sec{font-size:15px;font-weight:700;margin:28px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px;letter-spacing:-.2px}

/* knowledge grid */
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-bottom:20px}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid transparent}
.kc:nth-child(1){border-left-color:#e85d04}
.kc:nth-child(2){border-left-color:#0077b6}
.kc:nth-child(3){border-left-color:#059669}
.kc:nth-child(4){border-left-color:#7c3aed}
.kc:nth-child(5){border-left-color:#dc2626}
.kc h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--tx)}
.kc ul{margin:0;padding:0 0 0 17px;font-size:12px;color:var(--tx2);line-height:1.9}
.kc li{margin-bottom:2px}

/* resources */
.rg{margin-bottom:16px}
.rg-t{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.6px;margin-bottom:9px}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.r{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;display:block;transition:all .18s;box-shadow:var(--shadow)}
.r:hover{border-color:#b0b8c5;box-shadow:var(--shadow-h);transform:translateY(-1px)}
.r .n{font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:6px}
.r .n em{font-style:normal;font-size:9px;font-weight:700;color:#fff;padding:2px 5px;border-radius:4px;flex:none;letter-spacing:.2px}
.r .n em.b{background:#fb7299}.r .n em.d{background:#161823}.r .n em.g{background:#2563eb}
.r .n em.m{background:#0f766e}.r .n em.y{background:#dc2626}.r .n em.v{background:#7c3aed}
.r .n em.l{background:#e85d04}
.r .dsc{font-size:11px;color:var(--tx3);margin-top:4px;line-height:1.5}

/* checklist */
.it{display:flex;gap:10px;padding:7px 0;align-items:flex-start;cursor:pointer;font-size:13px;color:var(--tx2);line-height:1.6}
.it:hover{color:var(--tx)}
.it input{margin-top:3px;accent-color:var(--tx);cursor:pointer;flex:none;width:15px;height:15px}
.it.done{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--line)}
/* update button */
.upd{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;cursor:pointer;color:var(--tx3);margin-left:auto;white-space:nowrap;transition:all .15s;font-family:inherit}
.upd:hover{border-color:#c5b898;color:var(--tx2)}
.upd.req{background:#fef3c7;border-color:#fcd34d;color:#b45309;animation:updPulse 2s infinite}
@keyframes updPulse{50%{border-color:#f59e0b}}

/* mobile responsive */
@media(max-width:768px){
 aside{position:relative;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);box-shadow:none;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
 aside::-webkit-scrollbar{display:none}
 .s-top{width:100%;padding:14px 6px 8px}
 .s-sec{display:none}
 #side-cd{display:none}
 #side-nav,#side-other{display:flex;flex-direction:row;gap:3px;overflow-x:auto;padding:0;flex-wrap:nowrap}
 #side-nav .si,#side-other .si{border-left:0;border-bottom:3px solid transparent;padding:8px 10px;font-size:11px;white-space:nowrap;margin-right:0;border-radius:0;flex:none}
 #side-nav .si.on,#side-other .si.on{border-bottom-color:var(--c0229);background:transparent}
 .si .pct{display:none}
 .si .bar{display:none}
 #chk{display:none!important}
 #daycount{display:none}
 #side-cd{display:none}
 main{margin-left:0}
 .pg{padding:16px 14px 60px}
 .cds{grid-template-columns:repeat(2,1fr)}
 .kg{grid-template-columns:1fr}
 .rl{grid-template-columns:1fr}
 .phd{flex-wrap:wrap}
 .phd .cdt{font-size:17px}
}
@media(min-width:769px) and (max-width:1024px){
 .cds{grid-template-columns:repeat(2,1fr)}
 .kg{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}

/* notes */
textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:12px 14px;font:inherit;font-size:12.5px;line-height:1.8;resize:vertical;background:var(--panel);color:var(--tx);min-height:80px;transition:border-color .15s}
textarea:focus{outline:0;border-color:#a0a8b8}

/* checkin */
.chk{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chk button{font:inherit;font-size:11px;padding:5px 10px;border:1.5px solid #e0d8c8;background:#ede6d9;border-radius:6px;cursor:pointer;color:var(--tx2);transition:all .15s}
.chk button:hover{border-color:#c5b898}
.chk button.on{background:#d4e8cf;color:#2d6a2d;border-color:#8cc08e}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tools button{font:inherit;font-size:11.5px;padding:6px 11px;border:1.5px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;color:var(--tx2)}
.tools button:hover{border-color:var(--tx3);color:var(--tx)}

footer{font-size:11px;color:var(--tx3);margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
</style>
</head>

 {k:'wen_hand',name:'手写网文·零基础',color:'#059669',
  desc:'纯人工写作路线。平台：番茄小说（门槛最低，2万字可签约）→七猫→起点。核心逻辑：选对赛道 > 拆书模仿 > 动笔 > 签约 > 日更 > 30万字完本复盘。80%新人死在"写了2万字就切"——而通关秘诀只有一个：写完。',
  alarm:'<b>零基础承诺：</b>你不需要是"会写作的人"。写网文是一种可以通过模仿学会的手艺。整个番茄小说只有两类人会赚钱——日更不断的人，和日更不断且写得久的人。文笔是练出来的，不是天生带来的。',
  steps:[
   {n:'台阶0 · 了解这行（1-2天）',tag:'门槛：无',items:[
    '<b>任务：搞清楚网文是什么、怎么赚钱、平台怎么选。不做别的事，只做了解。</b>',
    '打开番茄小说APP→找"排行榜"→按"热读"排序→<b>只看前10本书的简介和前3章</b>，感受它们为什么能火',
    '选平台（三选一）：番茄（免费阅读+快节奏爽文，新人最友好）vs 七猫（逻辑严谨+有训练营+10元/千字奖学金）vs 起点（男频长篇大世界观，最难签但IP上限最高）',
    '去番茄的PC端作家专区→完成<b>实名认证</b>（不然后面无法签约，这一卡就是几天）',
    '今日成果：你知道自己要在哪个平台写了，知道这个平台读者喜欢什么类型的文。'
   ]},
   {n:'台阶1 · 拆书（第1周）',tag:'门槛：台阶0完成',items:[
    '<b>任务：拆解3本同类型爆款书。不写，只看。模仿是进步最快的方式。</b>',
    '选3本近3个月火起来的、和你打算写的类型一样的书（玄幻/言情/都市/悬疑/脑洞选一个你最爱看的）',
    '<b>拆第一本书：</b>只看前三章。记录：①第一句是什么 ②第一章300字内发生了什么事件 ③这个主角是好人坏人有趣的人——你怎么知道的（作者用了哪几个细节）',
    '<b>拆第二本书：</b>看前30章。记录：①每几章有一个爽点 ②每章结尾的钩子是什么（你为什么会点下一章）③剧情推进的节奏——快的时候多快，慢的时候多慢',
    '<b>拆第三本书：</b>翻评论区。记录：①读者在爽什么 ②读者在骂什么 ③什么角色读者最喜欢',
    '成果：你手里有一张<b>"节奏模板表"</b>——这是你开书时的作业本，告诉你每一步踩在哪里。学的是结构，不是抄剧情。'
   ]},
   {n:'台阶2 · 大纲+开篇（第2周）',tag:'门槛：台阶1完成',items:[
    '<b>任务：写好大纲和人设，写出前三章。不需要好看，只需要存在。</b>',
    '<b>写人设卡：</b>主角叫什么→几岁→什么性格→有什么缺陷→想要什么→谁在挡他路。反派同理。不超过一张纸。',
    '<b>写大纲：</b>不是写作文。就是列清单：第一卷讲什么（100字）→第1-10章每章一句话情节→第10-30章每章一句话情节。就够了。',
    '<b>前三章绝对标准（能不能签就看这个）：</b>第1章300字内必须发生一件让读者想知道"然后呢"的事。第1章结尾必须留一个明显到不能忽略的钩子。前三章必须让读者搞清楚"我为什么要在乎这个主角"。',
    '书名：7-10个字，带2个以上热词（比如"重生""逆袭""系统""签到"）。签约之后改书名极麻烦，一次定死。',
    '成果：你有大纲了，有人设卡了，有前三章了。不管质量如何，你已经超过了90%想写但一个字没写的人。'
   ]},
   {n:'台阶3 · 签约冲刺（第3-4周）',tag:'门槛：台阶2完成',items:[
    '<b>任务：攒够2万字，申请签约，进入日更节奏。</b>',
    '一次性备好2万字再发（不是写一章发一章）→发完的当天立刻在后台点"申请签约"。<b>避开周末提交——审核慢。</b>',
    '签约审核3-5天。审核期间保持每天更新，展示创作态度。通过率>60%，比考试简单。',
    '<b>固定一个时间更新（比如每晚8点）</b>——选一个你能雷打不动的时间。读者会形成追更习惯。',
    '每天目标：<b>4000字=2章×2000字</b>。番茄全勤要求日更4000字。先练肌肉，不在字数上打折。',
    '每章发布前检查：结尾有没有钩子→读者会不会点下一章。有，发。没有，加一句话再发。'
   ]},
   {n:'台阶4 · 完本（第2-4个月）',tag:'门槛：台阶3完成',items:[
    '<b>任务：写到30万字完本。不是写好，是写完。99%的新人死在这里。</b>',
    '8万字→系统验证期开始。10万字→首秀推流。这10万字是全书的命。不在这10万字里糊弄。',
    '盯一个数据：<b>10万字读完率</b>。低于15%说明方向有问题，认真考虑是否切文。高于25%说明找对了路子。',
    '不论数据好坏，<b>写到30万字再复盘。</b>切书狂魔永远困在开头。完本本身就是一种能力证明。',
    '完本之后做的事：①复盘整本书从0到30万字的数据变化 ②找出"写得顺"和"写得卡"的章节对比 ③带着复盘结果开下一本。',
    '赚到第一笔稿费的时间节点：全勤奖（签约后第一个完整月，¥600-800）+阅读分成（10万字后开始有）→第一个月通常¥500-1500。'
   ]}
  ],
  online:[

   {n:'番茄新手投稿全指南',u:'https://www.bilibili.com/read/cv20466069/',p:'B站专栏',pc:'b',d:'字数节点/收益规则/数据解读，全网最细'},

   {n:'网文写作 零基础教程',u:'https://search.bilibili.com/all?keyword=%E7%BD%91%E6%96%87%E5%86%99%E4%BD%9C+%E9%9B%B6%E5%9F%BA%E7%A1%80+%E6%96%B0%E4%BA%BA',p:'B站',pc:'b',d:'搜播放量高的，挑有实际成绩的UP主'},

 {k:'wen_ai',name:'AI写文·零基础',color:'#7c3aed',
  desc:'用AI辅助写作，保速度+保质量。核心公式：AI填内容覆盖日更字数→人定内核保证故事质量。番茄2万字签约→8万字验证→10万字首秀→日更4000字→全勤+分成叠加变现。',
  alarm:'<b>⚠ AI写作铁律：</b>① 纯AI生成不加修改会被判低质降量——每章至少30%人工润色。② 任何收费AI写作课都是骗局——所有SOP在网上免费公开。③ 第一本书写到30万字再复盘——切书狂魔永远困在开头。',
  steps:[
   {n:'台阶0 · 认识AI写作（第1天）',tag:'门槛：无',items:[
    '<b>任务：打开一个AI工具，让它帮你写300字的微小说。感受AI能做什么、不能做什么。</b>',
    '打开DeepSeek(chat.deepseek.com)，输入："帮我写一段300字的玄幻小说开头，主角是一个会说话的猫，背景是现代都市"。看结果。',
    '<b>同一段提示词，换到Kimi/豆包/通义千问各生成一次。</b>对比：哪个文风你喜欢？哪个废话少？哪个会自己编设定？',
    '观察三件事：① AI写空洞废话——"他的眼神深邃如星辰"这种 ② AI记不住之前写了什么——你说过的设定5句之后它就忘了 ③ AI不懂"节奏"——它不会在应该在的地方留钩子。这就是你以后要手动改的地方。',
    '今日成果：你知道AI写作的上限和下限了。它不是魔法，是一个跑得很快但方向感很差的助手。'
   ]},
   {n:'台阶1 · AI搭世界观+大纲（第2-3天）',tag:'门槛：台阶0完成',items:[
    '<b>任务：用AI帮你搭出一本书的完整骨架。</b>',
    '先上"手写网文"板块的台阶0和台阶1——你要先知道什么叫好大纲，才能让AI帮你想好大纲。顺序不能反。',
    '打开DeepSeek，输入："我需要你帮我设计一个玄幻小说的世界观。核心设定是[你自己想的那个点子]。请输出：①世界背景（300字）②势力分布（至少3个势力）③力量体系/等级 ④这个故事最大的矛盾是什么"',
    '拿到世界观之后，继续："基于上面的世界观，帮我设计一个主角。包括：姓名、年龄、性格、外貌、身世、核心欲望、最大的缺陷、成长路径。用一段话描述他出场时的场景。"',
    '再来："基于以上所有设定，帮我列出三卷大纲。每卷50字概述。再细化第一卷的前10章每章一句话剧情，标注每章的爽点位置。"',
    '<b>审核环节：</b>AI给的大纲通常有80%是对的但20%很无聊——你的工作是把无聊的20%替换成你自己的点子。AI提供砖瓦，你决定房子长什么样。'
   ]},
   {n:'台阶2 · AI扩写+黄金三章（第4-7天）',tag:'门槛：台阶1完成',items:[
    '<b>任务：让AI帮你写第一章初稿，然后你手动打磨到能签约的水平。</b>',
    '<b>开篇生成：</b>把大纲第一章的细纲+人设卡+你喜欢的文风参考喂给笔灵AI/灵蟹创作→生成3-5个不同版本的开篇→挑最有张力的那一版',
    '<b>人工打磨黄金三章（这部分AI帮不了）：</b>① 开头300字，必须出现核心冲突事件 ② 500字内拉出"主角想要什么+谁在挡他" ③ 第一章结尾留明显钩子 ④ 前三章让读者搞清楚"我为什么要在乎这个主角"',
    '<b>黄金标准自检：</b>把前三章发给一个没看过大纲的朋友，看完问两个问题：你想知道他接下来要干嘛吗；你觉得这个主角有意思吗。两个都是"是"，合格。',
    '成果：你有了一套能拿去投稿的开篇。虽然只有9000字（3章×3000字），但这是整本书最重要的9000字。'
   ]},
   {n:'台阶3 · AI辅助日更（第2-4周）',tag:'门槛：台阶2完成',items:[
    '<b>任务：建立"AI粗写→人工精修"的日更流水线。每天2-3小时，稳定输出4000字。</b>',
    '<b>日常流程：</b>把今天的章节细纲（3-5句话）丢给AI→AI扩写成2000字初稿（5-10分钟）→你花40-60分钟改三样东西：',
    '① 情绪戏（AI不会写"心碎"——只会写"他感到很难过"） ② 反转点（AI不会突然转折——只会平铺直叙） ③ 钩子（AI从来不会在结尾留悬念——这是你最要手动加的东西）',
    '固定每天同一个时间发，培养读者追更习惯。断更=流量腰斩。',
    '用Claude/DeepSeek做大纲Review：每写完10章，把前文大纲+已写内容喂给AI→让它找"人设前后矛盾""副线消失""节奏拖沓"的问题。',
    '签约之后：立刻激活全勤模式。日更4000字=¥600-800/月。这是最稳定的保底收入。'
   ]},
   {n:'台阶4 · 多书并行+优化变现（第2个月起）',tag:'门槛：台阶3完成',items:[
    '<b>任务：同时运营2-3本书，叠加全勤+分成收入。</b>',
    '<b>为什么多书并行：</b>番茄2026年全勤门槛提高（月收入需>500元才有资格）——一本书不够稳。同时开2-3本，确保至少一本达标。',
    '<b>AI是多书并行的唯一解：</b>一本书的AI粗写管日更，另一本书的AI粗写也管日更——人的时间只花在"改最精彩的部分"上。',
    '<b>收入结构：</b>①全勤叠加（2-3本×¥600-800）→¥1200-2400/月 ②阅读分成（稳定期每本¥10-20/日×30天）→¥300-600/月 ③飞卢短篇一次性稿费→¥300-800/本。三线并行，三个月累计¥10K+。',
    '<b>进阶工具：</b>灵蟹创作SoloEnt（一次性管理多本书的设定/大纲/伏笔）+ FeelFish（百万字上下文记忆，长篇不崩人设）。',
    '<b>终极提醒：</b>AI工具会越来越好——但人类的"在乎"永远是最稀缺的东西。读者来读你的书，不是因为流畅，而是因为你在乎这个主角。AI负责流畅，你负责在乎。'
   ]}
  ],

 {k:'other',name:'英语·西语·考研',color:'#059669',desc:'三板斧合在一起。英语：13000→四六级→考研英语一（共用一个底座）。西语：A1→B1长线兴趣。法学考研：2027年12月初试，不考数学。',alarm:'',steps:[
  {n:'英语综合路线',tag:'四线共底座',items:['13000（10/25下午）→12月四六级→2027考研英语一→雅思暂缓','每天单词30个+长难句2-3个，雷打不动','阅读1篇/天，计时15分钟','语法一次性学完（英语兔·语法入门），之后不再重学']},
  {n:'西班牙语',tag:'A1→B1',items:['教材：《现代西班牙语》新版 或 《走遍西班牙》','语音关2-3周：大舌音练drr/trr组合','动词变位每天手写5个→ser/estar是第一个分水岭','西语助手esdict.cn + 每日西语听力APP']},
  {n:'法学考研',tag:'2027.12初试·17个月',items:['考试：政治101+英语一201+专业基础+专业综合=500分','唯一核心书：高教社《考试分析》','基础→强化→冲刺→模考四阶段','优势：自考法学和法硕知识点底座是同一套']
  }],online:[
  {n:'法硕考试分析精讲',u:'https://search.bilibili.com/all?keyword=%E6%B3%95%E7%A1%95+%E8%80%83%E8%AF%95%E5%88%86%E6%9E%90+%E7%B2%BE%E8%AE%B2',p:'B站',pc:'b',d:'跟一位老师从头到尾'},
  {n:'研招网',u:'https://yz.chsi.com.cn',p:'官方',pc:'g',d:'报名/简章/调剂唯一入口'},
  {n:'西语助手',u:'https://www.esdict.cn',p:'工具',pc:'v',d:'查词+完整动词变位表'},
  {n:'英语兔语法',u:'https://search.bilibili.com/all?keyword=%E8%8B%B1%E8%AF%AD%E5%85%94+%E8%AF%AD%E6%B3%95',p:'B站',pc:'b',d:'一次性学完，不再回头'}
 ]}
];

/* ============ State ============ */
const KEY='studyhub_v2';
let S=JSON.parse(localStorage.getItem(KEY)||'{}');
S.ck=S.ck||{};S.note=S.note||{};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=dstr(new Date());

/* ============ Sidebar ============ */
function buildSidebar(){
 document.getElementById('today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
 // Countdown
 const now=new Date(), exam=new Date(EXAM_DATE), diff=exam-now, dd=Math.ceil(diff/86400000);
 document.getElementById('side-cd').innerHTML='<span style="font-size:26px">'+dd+'</span><span style="font-size:13px;font-weight:500;margin-left:2px">天</span>';
 document.getElementById('daycount').textContent=dd+'天';
 // Course nav
 const ckeys=Object.keys(COURSES);
 document.getElementById('side-nav').innerHTML=ckeys.map(k=>{
  const c=COURSES[k], ids=c.items.map(i=>i.id);
  const done=ids.filter(i=>S.ck[i]).length;
  return `<div class="si" data-p="${k}" onclick="go('${k}')"><span class="bar" style="background:${c.color}"></span>${c.name}<span class="pct">${done}/${ids.length}</span></div>`;
 }).join('');
 // Other sections
 document.getElementById('side-other').innerHTML=OTHER.map(o=>
  `<div class="si" data-p="${o.k}" onclick="go('${o.k}')"><span class="bar" style="background:${o.color}"></span>${o.name}</div>`).join('');
 // daily check buttons
 document.getElementById('chk').innerHTML=ckeys.map(k=>
  '<button style="width:100%;text-align:left;font-size:11px;padding:6px 10px;margin:0;border-radius:5px;background:#ede6d9;border:1px solid #e0d8c8;color:var(--tx2);cursor:pointer" data-d="0">'+COURSES[k].name+'</button>').join('');
 document.querySelectorAll('#chk button').forEach(b=>{
  b.onclick=function(){this.dataset.d=this.dataset.d==='1'?'0':'1'; this.style.background=this.dataset.d==='1'?'#d4e8cf':'#ede6d9'; this.style.borderColor=this.dataset.d==='1'?'#8cc08e':'#e0d8c8'; this.style.color=this.dataset.d==='1'?'#2d6a2d':'var(--tx2)';};
 });
}

/* ============ Main pages ============ */
function renderCourse(k){
 const c=COURSES[k],ids=c.items.map(function(i){return i.id;}),done=ids.filter(function(i){return S.ck[i];}).length;
 const pct=ids.length?Math.round(done/ids.length*100):0;
 var h='<div class="pg" id="pg-'+k+'">';
 // header
 h+='<div class="phd"><span class="cdt">'+c.name+'</span><span class="tag" style="background:'+(c.tagColor||c.color)+'">'+(c.tag||c.time)+'</span></div>';
 h+='<div class="pdesc">'+c.desc+'</div>';
 if(c.alarm) h+='<div class="alarm">'+c.alarm+'</div>';
 // progress
 h+='<div class="pbar"><div class="track"><i style="width:'+pct+'%;background:'+c.color+'"></i></div><div class="num">'+done+'/'+ids.length+'</div></div>';
 // knowledge
 h+='<div class="sec"><span class="bar" style="background:'+c.color+';width:4px;height:15px;display:inline-block;border-radius:2px"></span>知识点总结</div>';
 h+='<div class="kg">';
 c.know.forEach(function(kc){
  h+='<div class="kc"><h4>'+kc.t+'</h4><ul>';
  kc.items.forEach(function(item){ h+='<li>'+item+'</li>'; });
  h+='</ul></div>';
 });
 h+='</div>';
 // checklist
 h+='<div class="sec"><span class="bar" style="background:'+c.color+';width:4px;height:15px;display:inline-block;border-radius:2px"></span>备考清单</div>';
 c.items.forEach(function(i){
  var id=i.id, done2=S.ck[id]?'done':'', chk=S.ck[id]?'checked':'';
  h+='<label class="it '+done2+'" data-id="'+id+'"><input type="checkbox" '+chk+' onchange="toggleCheck(\''+id+'\',this)"><span>'+i.t+'</span></label>';
 });
 // local resources
 h+='<div class="sec"><span class="bar" style="background:'+c.color+';width:4px;height:15px;display:inline-block;border-radius:2px"></span>本地上传资料</div>';
 // Folder link
 var folder='G:\\\\法\\\\.workbuddy\\\\materials\\\\'+c.folder;
 h+='<div class="rl"><a class="r" href="file:///'+folder.replace(/\\\\/g,'/')+'" style="border-color:#d4c5a0;background:#fefdf8"><div class="n"><span>📂 打开本地资料文件夹</span><em class="l">文件管理器</em></div><div class="dsc">单击打开文件夹，或在地址栏输入:<br><span style="font-family:monospace;font-size:10px;user-select:all">'+folder+'</span></div></a>';
 c.local.forEach(function(r){ h+='<div class="r" style="cursor:default;opacity:.88"><div class="n"><span>'+r.n+'</span><em class="l">本地</em></div><div class="dsc">'+r.d+'</div></div>'; });
 h+='</div>';
 // online resources
 h+='<div class="sec"><span class="bar" style="background:'+c.color+';width:4px;height:15px;display:inline-block;border-radius:2px"></span>全网优质资源</div>';
 h+='<div class="rl">';
 c.online.forEach(function(r){ h+='<a class="r" href="'+r.u+'" target="_blank"><div class="n"><span>'+r.n+'</span><em class="'+(r.pc||'')+'">'+r.p+'</em></div><div class="dsc">'+r.d+'</div></a>'; });
 h+='</div>';
 // notes
 h+='<div class="sec"><span class="bar" style="background:'+c.color+';width:4px;height:15px;display:inline-block;border-radius:2px"></span>学习笔记</div>';
 h+='<textarea id="note-'+k+'" oninput="S.note[\''+k+'\']=this.value;save()">'+(S.note[k]||'')+'</textarea>';
 h+='</div>';
 return h;
}

function renderOther(k){
 var o=OTHER.find(function(x){return x.k===k;}), h='';
 var updKey='upd_'+k, updTime=S[updKey]||'v1';
 h='<div class="pg" id="pg-'+k+'"><div class="phd" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="cdt">'+o.name+'</span></div><button class="upd'+(S._updQ&&S._updQ[k]?' req':'')+'" onclick="reqUpd(\''+k+'\')" title="点击标记，下次对话时我会为你搜索全网最新资源并更新">📡 更新资源 <span style="font-size:9px">('+updTime+')</span></button></div>';
 h+='<div class="pdesc">'+o.desc+'</div>';
 if(o.alarm) h+='<div class="alarm">'+o.alarm+'</div>';
 if(o.steps&&o.steps.length){
  o.steps.forEach(function(s){
   h+='<div class="ph" data-fk="'+k+'_'+s.n+'"><div class="ph-h" onclick="var p=this.parentElement;p.classList.toggle(\'fold\')"><div class="n"><span class="tag" style="background:'+o.color+'">'+s.tag+'</span>'+s.n+'</div></div><div class="ph-b">';
   s.items.forEach(function(item){ h+='<div class="it" style="cursor:default;padding:9px 16px"><span>'+item+'</span></div>'; });
   h+='</div></div>';
  });
 }
 if(o.online&&o.online.length){
  h+='<div class="sec"><span class="bar" style="background:'+o.color+';width:4px;height:15px;display:inline-block;border-radius:2px"></span>资源与工具</div>';
  h+='<div class="rl">';
  o.online.forEach(function(r){
   h+='<a class="r" href="'+r.u+'" target="_blank"><div class="n"><span>'+r.n+'</span><em class="'+(r.pc||'')+'">'+r.p+'</em></div><div class="dsc">'+r.d+'</div></a>';
  });
  h+='</div>';
 }
 h+='</div>';
 return h;
}
function reqUpd(k){
 S._updQ=S._updQ||{}; S._updQ[k]=TODAY;save();
 var bt=document.querySelector('#pg-'+k+' .upd'); if(bt){bt.classList.add('req');bt.textContent='📡 已标记 '+TODAY;}
 setTimeout(function(){if(bt){bt.classList.remove('req');bt.textContent='📡 下次对话更新';}},3000);
}

function renderAll(){
 const main=document.getElementById('main');
 let h='';
 // Countdown strip
 const now=new Date(), exam=new Date(EXAM_DATE);
 const dates=[
  {k:'距开考',d:EXAM_DATE,note:'10/23-25'},
  {k:'10/23 周五',d:'2026-10-23T09:00',note:'国际法 / 证据法学'},
  {k:'10/24 周六',d:'2026-10-24T09:00',note:'国际法 / 行政法'},
  {k:'10/25 周日',d:'2026-10-25T09:00',note:'商法 / 英语'}
 ];
 h+=`<div class="cds">${dates.map(x=>{
  const t=new Date(x.d),d=Math.ceil((t-now)/86400000);
  const urgent=d<=30;
  return '<div class="cd'+(urgent?' urgent':'')+'"><div class="lb"><span class="dot'+(urgent?' r':'')+'"></span>'+x.k+'</div><div class="nm">'+d+'<small> 天</small></div><div class="dt">'+x.note+'</div></div>';
 }).join('')}</div>`;
 // Course pages
 for(const k in COURSES) h+=renderCourse(k);
 // Other pages
 for(const o of OTHER) h+=renderOther(o.k);
 main.innerHTML=h;
 // Set notes values
 for(const k in COURSES){
  const ta=document.getElementById('note-'+k);
  if(ta&&S.note[k]) ta.value=S.note[k];
 }
}

/* ============ Navigation ============ */
function go(p){
 document.querySelectorAll('.si').forEach(e=>e.classList.toggle('on',e.dataset.p===p));
 document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('on',e.id==='pg-'+p));
 window.scrollTo({top:0,behavior:'smooth'});
}

function toggleCheck(id,el){
 S.ck[id]=el.checked;save();
 el.closest('.it').classList.toggle('done',el.checked);
 buildSidebar();
 // Update course page progress bar
 const pg=el.closest('.pg'); if(!pg)return;
 const k=pg.id.replace('pg-',''); const c=COURSES[k];
 const ids=c.items.map(i=>i.id); const done=ids.filter(i=>S.ck[i]).length;
 const pct=ids.length?Math.round(done/ids.length*100):0;
 pg.querySelector('.track i').style.width=pct+'%';
 pg.querySelector('.num').textContent=done+'/'+ids.length;
}

/* ============ Init ============ */
buildSidebar();renderAll();
go(Object.keys(COURSES)[0]); // default to first course

// tools
function expJSON(){
 const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='自考进度备份-'+TODAY+'.json';a.click();
}
function impJSON(el){
 const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{S=JSON.parse(e.target.result);save();location.reload();}catch(x){alert('格式不对');}};
 r.readAsText(f);
}
function resetAll(){if(confirm('清空所有进度？不可恢复。')){localStorage.removeItem(KEY);location.reload();}}
</script>
</body>
</html>
